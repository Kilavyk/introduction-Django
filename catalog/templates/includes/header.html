<div class="d-flex justify-content-between align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <!-- Левая часть -->
    <nav class="d-flex">
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:post_list' %}">Блог</a>

        <!-- Выпадающий список категорий -->
        {% if categories %}  <!-- Проверяем, что категории существуют -->
        <div class="dropdown ms-2">
            <button class="p-2 btn btn-outline-primary me-2 dropdown-toggle" type="button" id="categoriesDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Категории
            </button>
            <ul class="dropdown-menu" aria-labelledby="categoriesDropdown">
                {% for category in categories %}
                    <li><a class="dropdown-item" href="{% url 'catalog:category_products' category.name %}">{{ category.name }}</a></li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </nav>

    <!-- Центральная часть -->
    <div class="text-center mx-3">
        <h5 class="my-0 font-weight-normal">Skystore</h5>
    </div>

    <!-- Правая часть -->
    <nav class="d-flex">
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-secondary me-2" href="{% url 'users:profile' %}">Профиль</a>
        <a class="p-2 btn btn-outline-danger" href="{% url 'users:logout' %}">Выйти</a>
        {% else %}
        <a class="p-2 btn btn-outline-success me-2" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-success" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
