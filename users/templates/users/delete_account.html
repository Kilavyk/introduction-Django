{% extends 'base.html' %}

{% block title %}Удаление аккаунта - Skystore{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Удаление аккаунта</h1>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card mb-4 box-shadow">
                <div class="card-body text-center">
                    <p class="lead">Вы уверены, что хотите удалить свой аккаунт?</p>
                    <p>Это действие нельзя отменить. Все ваши данные будут удалены.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-lg btn-danger">Да, удалить аккаунт</button>
                        <a href="{% url 'users:profile' %}" class="btn btn-lg btn-outline-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
