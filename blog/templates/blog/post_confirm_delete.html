{% extends 'base.html' %}

{% block title %}Удаление {{ object.title }} - Skystore{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Подтверждение удаления</h1>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card mb-4 box-shadow">
                <div class="card-body text-center">
                    <p class="lead">Вы уверены, что хотите удалить пост "{{ object.title }}"?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-lg btn-danger">Да, удалить</button>
                        <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-lg btn-outline-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
